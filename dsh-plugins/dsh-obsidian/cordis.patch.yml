# dsh-obsidian bundle layer: mount the plugin.
#
# The row carries no config on purpose. Every value has a default in the plugin,
# and the deployment-specific ones (which vault, where the workspace index
# lands) belong to the profile patch, not to the package — a bundle that
# hardcoded one machine's paths would be wrong everywhere else.
#
# A profile patch can override this row by id and restate the whole config:
#
#   - id: obsidian
#     name: dsh-obsidian
#     config:
#       vault: '/path/to/vault'
#       indexDir: '/path/to/workspace/obsidian'
#       writeAllow: ['notes/inbox']
- insert:
    - id: obsidian
      name: dsh-obsidian
